[package]
name = "mintcat-proc-mic"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lightweight Windows process audio router"
publish = false

[dependencies]
# Slint 1.18 会把 windows 拉到 0.62；必须对齐，否则 implement 宏和 IUnknownImpl 版本分裂。
slint = { version = "1.11", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
windows = { version = "0.62.2", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = "0.62.2"

[build-dependencies]
slint-build = "1.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
